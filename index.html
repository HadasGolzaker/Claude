<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voiceprint · טביעת קול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- design system: MUST stay first, every rule below builds on its tokens -->
<link rel="stylesheet" href="styles/voiceprint-theme.css">
<style>
/* This app's semantic names are kept as a thin alias layer over the design
   system in styles/voiceprint-theme.css, so the ~400 existing var(--ink) /
   var(--card) call sites below pick up the theme without being rewritten.
   Typography aliases live here; the colour aliases are set per theme further
   down. Never put a raw hex or font stack in this file: add it to the theme. */
:root{
  --font-serif:var(--font-display);
  --font-sans:var(--font-body);
  --radius:var(--radius-md);
}
*{box-sizing:border-box;margin:0;padding:0}
/* set for one frame by setTheme() — see the comment there */
html.vp-theme-switching,
html.vp-theme-switching *,
html.vp-theme-switching *::before,
html.vp-theme-switching *::after{transition:none !important}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.55;
  font-size:17px;
}
.serif{font-family:var(--font-serif)}

/* ---------- layout ---------- */
.app{max-width:1500px;margin:0 auto;padding:28px 20px 80px;display:grid;grid-template-columns:1fr 230px;gap:36px}
[dir="ltr"] .app{grid-template-columns:1fr 230px}
.app.no-aside,[dir="ltr"] .app.no-aside{grid-template-columns:1fr}
.app.no-aside aside{display:none}
main{min-width:0}
@media(max-width:820px){
  .app,[dir="ltr"] .app{grid-template-columns:1fr;gap:18px}
  aside{order:-1}
  header{flex-wrap:wrap}
  .header-controls{flex-wrap:wrap;justify-content:flex-end}
}

/* ---------- header ---------- */
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;direction:ltr}
header .logo,header .header-controls{direction:ltr}
.logo{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo h1{font-family:var(--font-serif);font-weight:700;font-size:1.6rem;letter-spacing:-.01em;flex-shrink:0}
.logo span{color:var(--ink);font-weight:700;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-toggle{display:flex;border:1.5px solid var(--ink);border-radius:var(--radius-pill);overflow:hidden}
.lang-toggle button{border:0;background:transparent;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.lang-toggle button.active{background:var(--ink);color:var(--paper)}
.post-lang-toggle{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- layers sidebar (signature) ---------- */
aside{position:sticky;top:24px;align-self:start}
.layers{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px}
.layers h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:14px}
.layer{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.layer:last-child{border-bottom:0}
.layer .dots{display:flex;gap:4px;margin-inline-start:auto}
.layer .dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .4s,transform .4s}
.layer .dot.on{background:var(--accent);transform:scale(1.15)}
.layer .name{font-weight:600;font-size:.9rem}
@media(max-width:820px){
  aside{position:static;min-width:0}
  .layers{display:flex;gap:12px;overflow-x:auto;padding:12px;min-width:0}
  .layers h3{display:none}
  .layer{flex-direction:column;border-bottom:0;min-width:86px;flex:0 0 auto;gap:5px;text-align:center}
  .layer .dots{margin:0}
  .layer .name{font-size:.75rem}
}

/* ---------- cards / steps ---------- */
.card{/* visuals come from .vp-card in the design system */}
@media(max-width:600px){.card{padding:24px 20px}}
.step{display:none;animation:rise .45s ease}
.step.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.step{animation:none}}

.eyebrow{margin-bottom:10px;display:block} /* type comes from .vp-label */
.q-title{font-family:var(--font-serif);font-weight:600;font-size:1.55rem;line-height:1.25;margin-bottom:8px}
.q-sub{color:var(--ink-soft);margin-bottom:22px;font-size:.98rem}
.lang-hint{display:inline-flex;align-items:center;gap:8px;background:var(--lavender-soft);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:.88rem;font-weight:600;margin-bottom:18px}

/* options */
.opt{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.opt:hover{background:var(--hover-fill)}
.opt.selected{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600}
.opt.selected:hover{background:var(--accent)}
.opt .rank-badge{position:absolute;inset-inline-end:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--lavender);color:var(--on-accent);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}

textarea,input[type=text]{
  width:100%;font:inherit;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 16px;background:var(--paper);resize:vertical;min-height:150px;color:var(--ink)
}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.char-note{font-size:.82rem;color:var(--ink-soft);margin-top:6px}

/* uploads */
.upload-box{border:2px dashed var(--line);border-radius:var(--radius-sm);padding:18px;text-align:center;cursor:pointer;transition:border-color .15s;margin-bottom:8px}
.upload-box:hover{border-color:var(--accent)}
.upload-box input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1.5px solid var(--line)}
.field-label{font-weight:700;margin:22px 0 8px;display:block}
.field-label small{font-weight:400;color:var(--ink-soft)}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:18px}
.btn{border:0;font:inherit;font-weight:700;border-radius:var(--radius-pill);padding:12px 28px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.progress-label{font-size:.85rem;color:var(--ink-soft)}

/* intro */
.intro h2{font-family:var(--font-serif);font-weight:700;font-size:2.3rem;line-height:1.15;margin-bottom:14px}
.intro p{color:var(--ink-soft);max-width:56ch;margin-bottom:12px}
.intro .start-row{margin-top:26px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* loading */
.loading{text-align:center;padding:60px 20px}
.pulse{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
.loading-preview{max-width:52ch;margin:16px auto 0;font-size:.95rem;line-height:1.55;color:var(--ink);text-align:start;min-height:1.5em}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--ink-soft)}

/* profile view — persona hero (photo · quick facts · summary) */
.persona-hero{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:16px;margin-bottom:26px;align-items:stretch}
@media(max-width:820px){.persona-hero{grid-template-columns:1fr}}
.persona-photo,.persona-layers{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.persona-photo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;justify-content:center}
.avatar-placeholder{width:104px;height:104px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.avatar-placeholder img{width:100%;height:100%;object-fit:cover}
.avatar-initials{font-family:var(--font-serif);font-weight:700;font-size:2rem;color:var(--ink)}
.avatar-placeholder svg{width:52px;height:52px;color:var(--ink)}
.avatar-caption{font-size:.9rem;color:var(--ink-soft);line-height:1.5}
.avatar-caption b{display:block;margin-bottom:4px;color:var(--ink);font-weight:600}
.persona-layers .section-h{margin-top:0}
.persona-summary{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;justify-content:center}
.persona-summary .section-h{color:var(--bg);border-bottom-color:color-mix(in srgb, var(--on-accent) 30%, transparent);margin-top:0}
.persona-summary-text{font-size:1.08rem;line-height:1.6}

/* horizontal-scroll model-layer cards */
.layer-scroll{display:flex;gap:14px;overflow-x:auto;padding:6px 0 14px;margin-bottom:12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.layer-card{flex:0 0 auto;width:78%;max-width:300px;border-radius:var(--radius);padding:18px 20px;scroll-snap-align:start;color:var(--on-accent)}
.layer-card .section-h{margin:0 0 12px;border:0;padding:0;color:var(--on-accent)}
.layer-card .trait-name{width:88px;font-size:.82rem}
.layer-card .trait-score{width:22px;font-size:.82rem}
.layer-card .char-note{color:var(--on-accent);opacity:.72}
.layer-card .chip,.layer-card .chip-block{background:color-mix(in srgb, var(--surface-paper) 55%, transparent);border-color:color-mix(in srgb, var(--on-accent) 15%, transparent)}
.layer-card .dna-list li{border-bottom-color:color-mix(in srgb, var(--on-accent) 18%, transparent)}
@media(min-width:600px){.layer-card{width:280px}}

/* writing DNA + writing rules, two columns */
.dna-rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
@media(max-width:700px){.dna-rules-grid{grid-template-columns:1fr;gap:6px}}
.rules-list li{border-inline-start:3px solid var(--line);padding-inline-start:12px;border-bottom:0;margin-bottom:8px}
.rules-list li.rule-do{border-inline-start-color:var(--olive)}
.rules-list li.rule-dont{border-inline-start-color:var(--ink)}

.trait-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.trait-name{width:170px;font-weight:600;font-size:.92rem;flex-shrink:0}
.trait-bar{flex:1;height:10px;background:var(--paper);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.trait-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .8s ease}
.trait-score{width:34px;text-align:center;font-weight:700;font-size:.9rem}
.section-h{font-family:var(--font-serif);font-weight:600;font-size:1.15rem;margin:26px 0 12px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.chip{display:inline-block;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-pill);padding:5px 14px;margin:0 0 8px;margin-inline-end:8px;font-size:.88rem;font-weight:600}
.chip-block{display:block;border-radius:var(--radius-md);padding:14px 18px;margin:0 0 10px;line-height:1.45}
.chip.hot{border-color:var(--amber);background:var(--amber-soft)}
.dna-list{list-style:none}
.dna-list li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.dna-list li:last-child{border:0}
.dna-list b{color:var(--ink)}
.gap-note{background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:var(--radius-sm);padding:14px 16px;margin-top:18px;font-size:.92rem}
.error-box{background:var(--danger-soft);border:1.5px solid var(--danger);color:var(--danger);border-radius:var(--radius-sm);padding:14px 16px;margin-top:14px;font-size:.92rem}
.approved-banner{background:var(--accent);color:var(--on-accent);border-radius:var(--radius-sm);padding:18px 20px;margin-top:20px;font-weight:600}
</style>

<style>
/* ==========================================================
   OPPO BRAND PASS — clean, flat, minimal (overrides above)
   ========================================================== */
/* ---- colour aliases -> design-system tokens (dark is the theme default) ---- */
:root{
  --radius:var(--radius-md);
  --bg:var(--surface-canvas);
  --paper:var(--surface-card-alt);
  --card:var(--surface-card);
  --ink:var(--text-display);
  --ink-soft:var(--text-muted);
  --line:var(--border-hairline);
  --accent:var(--violet-300);        /* pale enough that --on-accent is ink */
  --accent-soft:color-mix(in srgb, var(--violet-300) 22%, transparent);
  --amber:var(--amber-400);
  --amber-soft:color-mix(in srgb, var(--amber-400) 24%, transparent);
  --danger:var(--magenta-500);
  --danger-soft:color-mix(in srgb, var(--magenta-500) 20%, transparent);
  --lavender:var(--violet-300);
  --lavender-soft:color-mix(in srgb, var(--violet-300) 24%, transparent);
  --olive:var(--teal-400);
  --olive-soft:color-mix(in srgb, var(--teal-400) 22%, transparent);
  --peach:var(--orange-500);
  --shadow:var(--shadow-hard-sm);
  --hover-fill:color-mix(in srgb, var(--text-display) 10%, transparent);
  /* category accents for idea/comment pills */
  --g-blue:var(--violet-300);
  --g-orange:var(--orange-500);
  --g-pink:var(--magenta-400);
  --g-green:var(--teal-400);
  --g-lime:var(--yellow-400);
  --on-primary:var(--action-primary-text);
  --on-accent:var(--ink-black);      /* text sitting on --accent / --g-* fills */
}
/* Light mode: hand-picked pairings from the theme, never a filter inversion.
   Accents darken here, so text on them flips to the light ink. */
:root[data-theme="light"]{
  --accent:var(--action-primary-bg);
  --lavender:var(--action-primary-bg);
  --danger:var(--magenta-600);
  --peach:var(--orange-600);
  --on-accent:var(--action-primary-text);
}
body{
  font-family:var(--font-sans);
  font-size:18px;line-height:1.62;
  background:var(--bg);color:var(--ink);
  font-weight:400;
}
.serif,.logo h1,.q-title,.section-h,.intro h2{font-family:var(--font-serif)}
.intro h2{line-height:1.08}
html[lang="en"] .logo h1{font-size:2rem}
html[lang="en"] .q-title{font-size:2rem;line-height:1.15}
html[lang="en"] .intro h2{font-size:3rem;line-height:1.05}
html[lang="en"] .section-h{font-size:1.4rem}
.q-title{font-size:1.75rem;font-weight:600}
.intro h2{font-size:2.6rem;font-weight:700}
/* larger, readable type (body min 18px, titles min 21px) */
.q-sub,.char-note,.dna-list li,.idea-angle,.opt,.field-label{font-size:1rem}
.idea-title{font-size:1.05rem;font-weight:600}
.chip{font-size:.92rem;font-weight:500}
.section-h{font-size:1.22rem;font-weight:600}
.eyebrow{font-weight:600;font-size:.75rem}
/* Hebrew tuning across all stages */
html[lang="he"] body{font-size:18px;line-height:1.7}
html[lang="he"] .intro h2{font-size:2.3rem;line-height:1.2}
html[lang="he"] .q-title{font-size:1.7rem;line-height:1.35}
html[lang="he"] .section-h{font-size:1.3rem}
html[lang="he"] .q-sub,html[lang="he"] .char-note,html[lang="he"] .dna-list li{font-size:1.02rem}
html[lang="en"] body{font-size:17px}

/* ---------- flat cards & surfaces ---------- */
/* .card carries .vp-card in the markup: background, 3px border, radius and the
   hard shadow all come from the design system. Only layout stays local. */
.layers{
  background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.opt{
  background:var(--paper);
  border:1.5px solid var(--line);border-radius:14px;
}
.opt:hover{background:var(--hover-fill)}
.opt.selected{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.opt.selected:hover{background:var(--accent)}
textarea,input[type=text]{
  background:var(--paper);
  border:1.5px solid var(--line);border-radius:12px;color:var(--ink);
}

/* ---------- buttons: black primary pill, outline secondary, grey hover ---------- */
.btn{border-radius:var(--radius-pill);font-weight:600}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{background:var(--accent);filter:brightness(1.06)}
.btn-danger:hover{background:var(--danger);filter:brightness(1.06)}
/* the theme styles .vp-btn[disabled]; give the secondary the same treatment */
.vp-btn-secondary[disabled]{opacity:.45;cursor:not-allowed}
.chip{
  background:var(--paper);
  border:1.5px solid var(--line);
}
.chip.hot{background:var(--peach);border-color:var(--peach)}
.upload-box{background:var(--paper);border:2px dashed var(--line);border-radius:14px}
.upload-box:hover{border-color:var(--accent)}
.lang-toggle{border-color:var(--ink)}
.gap-note{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.error-box{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
:root[data-theme="dark"] .error-box{background:var(--danger-soft);color:var(--danger)}

.trait-fill{background:var(--accent)}
.approved-banner{background:var(--accent);color:var(--on-accent)}
.logo span{color:var(--ink)}

/* brainstorm idea pills — brand palette per category */
.idea-pills{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.idea-pill{border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-hard-sm);animation:ideaIn .5s cubic-bezier(.2,.7,.2,1) both}
.idea-head{width:100%;text-align:start;border:0;cursor:pointer;background:var(--pg);color:var(--on-accent);font:inherit;padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.idea-cat{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.66}
.idea-title{font-weight:600;font-size:1.02rem;line-height:1.25}
.idea-body{max-height:0;overflow:hidden;background:var(--card);transition:max-height .35s ease,padding .35s ease;padding:0 18px}
/* generous enough for angle + personal-angle textarea + both action buttons —
   a fixed max-height just needs to clear the tallest real content, not match it */
.idea-pill.open .idea-body{max-height:560px;padding:16px 18px}
.idea-angle{margin-bottom:14px;color:var(--ink)}
@keyframes ideaIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.idea-pill{animation:none}}
/* brainstorm setup panel */
.ideas-setup{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:10px;background:var(--paper)}
.cat-checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 0 4px}
.cat-check{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem;cursor:pointer}
.cat-check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.idea-personal{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.idea-personal textarea{margin-top:6px;max-height:140px}

/* ===== profile screen, rebuilt on the design system ===== */
.vp-profile{position:relative}
/* decorative shapes, purely atmospheric */
.vp-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;border-radius:inherit}
/* a full ring pushed partly off-canvas: reads as a partial arc without a
   clip-path, which would not mirror under RTL */
.vp-deco-ring{position:absolute;top:150px;inset-inline-end:-118px;width:190px;height:190px;border:26px solid var(--magenta-500);border-radius:var(--radius-pill);opacity:.85}
.vp-deco-arch{position:absolute;top:90px;inset-inline-end:60px;width:120px;height:170px;background:var(--orange-600);border-radius:var(--radius-arch);opacity:.28}
.vp-profile > *:not(.vp-deco){position:relative;z-index:1}

.vp-display{font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-h1);line-height:var(--lh-heading);letter-spacing:var(--ls-display);color:var(--text-display);margin:6px 0 10px}
.vp-display-sub{color:var(--text-muted);max-width:52ch;margin-bottom:var(--space-6)}

/* hero trio */
.vp-hero{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-6)}
@media(max-width:900px){.vp-hero{grid-template-columns:1fr}}
.vp-hero-summary,.vp-hero-facts,.vp-hero-portrait{border-radius:var(--radius-lg);padding:var(--space-5)}
.vp-hero-summary{background:var(--gradient-violet);color:var(--text-on-brand);box-shadow:var(--shadow-glow-violet)}
.vp-hero-summary .vp-hero-h{color:var(--text-on-brand)}
.vp-hero-text{font-size:var(--fs-body);line-height:var(--lh-body);margin:0}
.vp-hero-facts,.vp-hero-portrait{background:var(--surface-card-alt);border:var(--border-thin)}
.vp-hero-h{font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-h3);color:var(--text-display);margin-bottom:var(--space-3)}
.vp-facts{list-style:none;margin:0;padding:0}
.vp-facts li{display:flex;flex-wrap:wrap;gap:2px var(--space-3);justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:var(--border-thin);min-width:0}
.vp-facts li:last-child{border-bottom:0}
.vp-fact-k{font-weight:var(--fw-body-bold);color:var(--text-display);flex:0 1 auto;min-width:0}
.vp-fact-v{color:var(--text-muted);text-align:end;min-width:0;overflow-wrap:break-word;margin-inline-start:auto}

<script>
/* set theme before paint (no flash); follows saved choice or system preference */
(function(){try{var s=localStorage.getItem('vp_theme');
  var m=s||((window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light');
  document.documentElement.setAttribute('data-theme',m);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
function setTheme(mode){
  var de=document.documentElement;
  /* Suppress transitions across the swap. A property that is BOTH transitioned
     and fed by a custom property (e.g. .vp-btn-secondary's colour) can stay
     stuck on the old theme's value when the attribute flips, because the
     in-flight transition is not re-resolved against the new token. Killing
     transitions for one frame forces a clean re-resolve, and stops every
     colour on the page animating at once, which looked messy anyway. */
  de.classList.add('vp-theme-switching');
  de.setAttribute('data-theme',mode);
  try{localStorage.setItem('vp_theme',mode);}catch(e){}
  void de.offsetHeight; /* flush: resolve the new colours before re-enabling */
  requestAnimationFrame(function(){ de.classList.remove('vp-theme-switching'); });
  if(typeof renderProfilePicker==='function') renderProfilePicker(); /* refresh the menu's active state */
}
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  setTheme(cur==='dark'?'light':'dark');}
</script>

function closeUserMenu(){
  const panel=document.getElementById('user-menu-panel');
  const btn=document.getElementById('user-menu-btn');
  if(panel) panel.hidden=true;
  if(btn) btn.setAttribute('aria-expanded','false');
}

function wireUserMenu(){
  const btn=document.getElementById('user-menu-btn');
  const panel=document.getElementById('user-menu-panel');
  if(!btn||!panel) return;
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const willOpen=panel.hidden;
    panel.hidden=!willOpen;
    btn.setAttribute('aria-expanded', willOpen?'true':'false');
  });
  /* delegated: panel content is rebuilt by renderProfilePicker(), so a single
     listener on the (stable) panel element covers every rebuild */
  panel.addEventListener('click',e=>{
    const item=e.target.closest('[data-action]');
    if(!item) return;
    closeUserMenu();
    switch(item.dataset.action){
      case 'new-post': startNewPost(); break;
      case 'reply-post': preMenuStep=step; step=STEP_REPLY; render(); break;
      case 'history': preMenuStep=step; step=STEP_HISTORY; render(); break;
      case 'switch': switchProfile(item.dataset.id); break;
      case 'new-profile': startNewProfile(); break;
      case 'delete-profile': openDeleteModal(item.dataset.id); break;
      case 'set-lang': setLang(item.dataset.lang); break;
      case 'set-theme': setTheme(item.dataset.mode); break;
      case 'logout': { const b=document.getElementById('vp-logout'); if(b) b.click(); break; }
    }
  });
  document.addEventListener('click',e=>{
    if(!panel.hidden && !e.target.closest('.user-menu-wrap')) closeUserMenu();
  });
}

/* ---------- delete profile (bin icon -> type-DELETE confirmation) ---------- */
function openDeleteModal(id){
  const t=T();
  const entry=profilesStore.profiles.find(p=>p.id===id);
  if(!entry) return;
  const ov=document.createElement('div');
  ov.id='vp-del';
  ov.innerHTML=`<div class="box">
    <h2>${t.del_title}</h2>
    <p>${t.del_warn.replace('{name}','<b>'+escapeHtml(entry.name)+'</b>')}</p>
    <p class="del-type">${t.del_type}</p>
    <input id="vp-del-input" type="text" autocomplete="off" spellcheck="false" placeholder="DELETE">
    <div class="row">
      <button class="vp-btn-secondary" id="vp-del-cancel">${t.del_cancel}</button>
      <button class="vp-btn btn-danger" id="vp-del-confirm" disabled>${t.del_btn}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const inp=ov.querySelector('#vp-del-input');
  const confirm=ov.querySelector('#vp-del-confirm');
  inp.addEventListener('input',()=>{ confirm.disabled = inp.value!=='DELETE'; });
  ov.querySelector('#vp-del-cancel').addEventListener('click',()=>ov.remove());
  confirm.addEventListener('click',async()=>{
    if(inp.value!=='DELETE') return;
    ov.remove();
    await deleteProfile(entry.id);
  });
  inp.focus();
}

async function deleteProfile(id){
  if(!id) return;
  const wasActive = id===activeProfileId;
  profilesStore.profiles=profilesStore.profiles.filter(p=>p.id!==id);
  if(!wasActive){
    /* deleting a profile you're not currently viewing — just drop it from
       the list, nothing about the current screen changes */
    try{ await persistProfiles(); }catch(e){ console.warn('storage failed',e); }
    renderProfilePicker();
    return;
  }
  const next=profilesStore.profiles[0];
  if(next){
    switchProfile(next.id); /* persists the new activeId */
  }else{
    profilesStore.activeId=null; activeProfileId=null;
    try{ await persistProfiles(); }catch(e){ console.warn('storage failed',e); }
    startNewProfile();
  }
}

function switchProfile(id){
  const entry=profilesStore.profiles.find(p=>p.id===id);
  if(!entry) return;
  activeProfileId=id; profilesStore.activeId=id;
  persistProfiles().catch(()=>{});
  profile=entry.profile; profileName=entry.name; profileCountry=entry.country||'';
  if(profile && !profile._lang) profile._lang=entry.lang||lang;
  approved=true;
  currentPost=null; postInput=''; postLink=''; postImages=[]; lastRefineNote=null; postLang=null; currentHistoryId=null; postApproved=false; comments=null;
  replySource=''; replyNote=''; replies=null;
  step=QUESTIONS.length+1;
  renderProfilePicker(); renderLayers(); render();
  if(profile && profile._lang!==lang) translateProfile(lang);
}

function startNewProfile(){
  activeProfileId=null;
  profile=null; approved=false;
  Object.keys(answers).forEach(k=>delete answers[k]);
  uploads={posts:'',about:'',images:[],noLinkedIn:false};
  profileName=''; profileCountry='';
  currentPost=null; postInput=''; postLink=''; postImages=[]; lastRefineNote=null; postLang=null; currentHistoryId=null; postApproved=false; comments=null;
  replySource=''; replyNote=''; replies=null;
  step=-1;
  clearDraft(); /* deliberately starting fresh — don't resurrect an old draft later */
  renderProfilePicker(); renderLayers(); render();
}

wireUserMenu();

/* ---------- sidebar ---------- */
function renderLayers(){
  const filled = {};
  LAYERS.forEach(L=>filled[L.id]=0);
  Object.keys(answers).forEach(qid=>{
    if(!answered(qid)) return;
    (FEEDS[qid]||[]).forEach(id=>filled[id]=(filled[id]||0)+1);
  });
  const el = document.getElementById('layers-panel');
  el.innerHTML = `<h3>${lang==='he'?'שכבות הפרופיל':'Profile layers'}</h3>` +
    LAYERS.map((L,li)=>{
      const n = Math.min(filled[L.id]||0, L.slots);
      const g=['var(--g-blue)','var(--g-orange)','var(--g-pink)','var(--g-green)','var(--g-lime)'][li%5];
      let dots='';
      for(let i=0;i<L.slots;i++) dots+=`<span class="dot ${i<n?'on':''}" style="${i<n?'background:'+g:''}"></span>`;
      return `<div class="layer"><span class="name">${L[lang]}</span><span class="dots">${dots}</span></div>`;
    }).join('');
}

function answered(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  const v = answers[qid];
  if(!q) return false;
  if(q.type==='open') return v && v.trim().length>=30;
  if(q.type==='single') return !!v;
  if(q.type==='rank') return Array.isArray(v) && v.length===q.max;
  /* Q10 is calibration material; if the user has no LinkedIn it's optional
     (the free-text answers Q1/Q6/Q9 already give writing samples) */
  if(q.type==='uploads') return uploads.noLinkedIn||(uploads.posts.trim().length>50)||uploads.images.length>0;
  return false;
}

/* ---------- render ---------- */
function render(){
  const card = document.getElementById('main-card');
  /* the layers progress sidebar only makes sense while answering questions —
     it just shows stale, fully-filled dots everywhere else and eats width
     that the results/composer screens want for themselves */
  const appEl = document.querySelector('.app');
  const showAside = step>=0 && step<QUESTIONS.length;
  if(appEl) appEl.classList.toggle('no-aside', !showAside);
  if(step===-1){ card.innerHTML = introHTML(); wireIntro(); return; }
  if(step===QUESTIONS.length){ card.innerHTML = generateHTML(); return; }
  if(step===QUESTIONS.length+1){ card.innerHTML = profileHTML(); wireProfile(); wireRefine(); return; }
  if(step===STEP_COMPOSER){ card.innerHTML = composerHTML(); wireComposer(); return; }
  if(step===STEP_RESULT){ card.innerHTML = resultHTML(); wireResult(); return; }
  if(step===STEP_HISTORY){ card.innerHTML = historyHTML(); wireHistory(); return; }
  if(step===STEP_REPLY){ card.innerHTML = replyHTML(); wireReply(); return; }
  card.innerHTML = questionHTML(QUESTIONS[step]);
  wireQuestion(QUESTIONS[step]);
  renderLayers();
}

function wireIntro(){
  const n=document.getElementById('intro-name');
  const c=document.getElementById('intro-country');
  const listEl=document.getElementById('country-list');
  const b=document.getElementById('start-btn');
  const loc=lang==='he'?'he':'en';
  let items;
  try{
    const dn=new Intl.DisplayNames([loc],{type:'region'});
    items=COUNTRY_CODES.map(code=>({code,label:dn.of(code)||code}));
  }catch(e){ items=COUNTRY_CODES.map(code=>({code,label:code})); }
  items.sort((a,b2)=>a.label.localeCompare(b2.label,loc));

  let activeIdx=-1, filtered=items;
  const setName=()=>{ profileName=n.value.trim(); b.disabled=!profileName; scheduleDraftSave(); };
  n.addEventListener('input',setName);

  /* show the current country's name in the field (not the code) */
  if(profileCountry){ const cur=items.find(i=>i.code===profileCountry); if(cur) c.value=cur.label; }

  function renderList(){
    if(!filtered.length){ listEl.innerHTML=`<div class="combo-empty">${T().country_none}</div>`; }
    else listEl.innerHTML=filtered.map((i,idx)=>`<div class="combo-opt${idx===activeIdx?' active':''}" role="option" data-code="${i.code}">${i.label}</div>`).join('');
  }
  function open(){ listEl.hidden=false; c.setAttribute('aria-expanded','true'); renderList(); }
  function close(){ listEl.hidden=true; c.setAttribute('aria-expanded','false'); activeIdx=-1; }
  function filter(){
    const q=c.value.trim().toLowerCase();
    filtered=q?items.filter(i=>i.label.toLowerCase().includes(q)):items;
    activeIdx=-1; open();
  }
  function pick(code){
    const it=items.find(i=>i.code===code); if(!it) return;
    profileCountry=code; c.value=it.label; close(); scheduleDraftSave();
  }

  c.addEventListener('focus',()=>{ filtered=items; open(); });
  c.addEventListener('input',()=>{ profileCountry=''; filter(); });
  c.addEventListener('keydown',e=>{
    if(listEl.hidden && (e.key==='ArrowDown'||e.key==='ArrowUp')){ filter(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx=Math.min(activeIdx+1,filtered.length-1); renderList(); scrollActive(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx=Math.max(activeIdx-1,0); renderList(); scrollActive(); }
    else if(e.key==='Enter'){ if(activeIdx>-1&&filtered[activeIdx]){ e.preventDefault(); pick(filtered[activeIdx].code); } }
    else if(e.key==='Escape'){ close(); }
  });
  function scrollActive(){ const el=listEl.querySelector('.combo-opt.active'); if(el) el.scrollIntoView({block:'nearest'}); }
  listEl.addEventListener('mousedown',e=>{ const o=e.target.closest('.combo-opt'); if(o){ e.preventDefault(); pick(o.dataset.code); } });
  document.addEventListener('mousedown',e=>{ if(!e.target.closest('.combo')) close(); });

  setName();
}

/* ---------- Q3 drag-and-drop ranking ---------- */
/* Custom POINTER-based drag (mouse + touch), not native HTML5 DnD which is
   flaky and doesn't work on touch. Drag a motive into a numbered slot to
   rank it, drag between slots to reorder, drag back to the pool to remove.
   A plain tap on a pool option also places it (convenience). */
function wireRank(q){
  const slotsEl=document.getElementById('rank-slots');
  const poolEl=document.getElementById('rank-pool');
  const getSel=()=>answers[q.id]||[];
  const setSel=arr=>{ answers[q.id]=arr; scheduleDraftSave(); render(); };
  function placeAt(v, slotIdx){
    let sel=getSel().filter(x=>x!==v);
    if(slotIdx==null||slotIdx<0) slotIdx=sel.length;
    slotIdx=Math.max(0,Math.min(slotIdx, sel.length, q.max-1));
    sel.splice(slotIdx,0,v);
    if(sel.length>q.max) sel=sel.slice(0,q.max);
    setSel(sel);
  }
  function remove(v){ setSel(getSel().filter(x=>x!==v)); }

  let drag=null;
  function clearOver(){ slotsEl.querySelectorAll('.rank-slot').forEach(s=>s.classList.remove('over')); poolEl.classList.remove('over'); }
  function targetAt(x,y){
    drag.ghost.style.display='none';
    const el=document.elementFromPoint(x,y);
    drag.ghost.style.display='';
    return el;
  }
  function onMove(e){
    if(!drag) return;
    e.preventDefault();
    drag.moved=true;
    drag.ghost.style.left=(e.clientX-drag.dx)+'px';
    drag.ghost.style.top=(e.clientY-drag.dy)+'px';
    const el=targetAt(e.clientX,e.clientY);
    clearOver();
    const slot=el&&el.closest('.rank-slot');
    if(slot) slot.classList.add('over');
    else if(el&&el.closest('#rank-pool')) poolEl.classList.add('over');
  }
  function onUp(e){
    window.removeEventListener('pointermove',onMove);
    window.removeEventListener('pointerup',onUp);
    if(!drag) return;
    const {v,ghost,moved}=drag;
    const el=targetAt(e.clientX,e.clientY);
    ghost.remove(); clearOver(); drag=null;
    const slot=el&&el.closest('.rank-slot');
    if(slot) placeAt(v, +slot.dataset.slot);          /* onto a slot -> rank there */
    else if(getSel().includes(v)) remove(v);          /* a ranked chip dragged off the slots -> remove */
    else if(!moved) placeAt(v,null);                  /* a tap on a pool option -> place */
    else render();                                    /* pool option dropped nowhere -> restore */
  }
  function onDown(e){
    if(e.button!=null && e.button>0) return;
    const chip=e.currentTarget, v=chip.dataset.v;
    e.preventDefault();
    const r=chip.getBoundingClientRect();
    const ghost=chip.cloneNode(true);
    ghost.classList.add('rank-ghost');
    ghost.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;margin:0;pointer-events:none;z-index:2000';
    document.body.appendChild(ghost);
    chip.classList.add('drag-source');
    drag={v,ghost,dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false};
    window.addEventListener('pointermove',onMove,{passive:false});
    window.addEventListener('pointerup',onUp);
  }
  document.querySelectorAll('.rank-chip[data-v]').forEach(chip=>chip.addEventListener('pointerdown',onDown));
}

/* =========================================================
   PROFILE ENGINE — Claude API
   ========================================================= */

/* ---------- profile generation prompt, split into 3 groups that run as
   parallel Claude calls (see runGeneration) so Opus's depth is affordable
   time-wise: each call only has to write ~1/3 of the profile. ---------- */
const PROFILE_HEADER = `
You are an expert personality psychologist profiling a person for a LinkedIn ghostwriting platform. Your job is to READ A PERSON, not to summarize a form.

CRITICAL — INFER, DON'T ECHO: Never restate or lightly paraphrase what the user wrote, and NEVER quote their answers back word-for-word. Every insight must be an INFERENCE that goes beyond the surface of their answers — read between the lines, connect signals across different questions, name the underlying trait/drive/tension the person may not even see about themselves. If a line could be produced just by rephrasing one answer, it is wrong; replace it with what that answer REVEALS about who they are.
Example — if the user answered "I like planning everything in advance": a BAD evidence line is "she likes to plan ahead" (that's just the answer restated). A GOOD evidence line is "needs certainty before she'll commit to anything" (that's what the answer reveals about her).

PLAIN LANGUAGE: write for a smart everyday reader ("the average Joe"), not for psychologists. Explain what you see in warm, clear, jargon-free words. When you draw on a framework (Big 5, Enneagram, Hofstede, etc.), translate it into plain human terms rather than naming clinical constructs — the insight should land, not sound like a textbook.

LANGUAGE: write the ENTIRE response in {LANG} only — every field, with no exceptions. Never insert words, phrases, or quotes from another language, not even a single term. If {LANG} is Hebrew, address the reader in gender-neutral Hebrew (plural forms like את/ה, אתם — never a masculine-only conjugation), matching the rest of this app.

GRAMMAR AND FLUENCY (STRICT): every single value must be a complete, grammatically correct, natural-sounding sentence or clause in {LANG} — never a broken fragment, never a construction that only makes sense translated literally from English. If {LANG} is Hebrew: write the way a fluent native Hebrew speaker actually talks, with correct subject-verb agreement and natural word order — do NOT invent awkward metaphors or compressed poetic images (e.g. no "מנוע שקט של רצון", no machinery/engine metaphors) just to sound literary; plain direct Hebrew beats a clever but broken sentence. Before outputting each field, silently check it reads smoothly out loud — if it sounds odd, choppy, or grammatically wrong, rewrite it simpler even if that means using a few more words than the target length.

PUNCTUATION: never use an em dash (—) anywhere, in any field, for any reason. Use a comma, period, or a new sentence instead.
`;

const FRAMEWORK_BIG5 = `
BIG 5 — score each 1-5 using both closed answers AND language markers in free text (open-vocabulary method, Park et al. 2014):
- Extraversion: social words, exclamation marks, emojis, short energetic sentences, calls to action vs. reflective first-person, longer sentences, ellipses.
- Openness: metaphors, abstract/idea words, original syntax, varied topics vs. concrete, practical, routine language.
- Conscientiousness: planning words, structured syntax, standard punctuation vs. "we'll see", topic-jumping, casual flow.
- Agreeableness: warm words (thanks, together, appreciate), soft phrasing, hearts vs. sharp, competitive, blunt language.
- Neuroticism: stress words, multiple !!/..., dramatic phrasing vs. calm, solution-focused, proportionate language.
`;

const FRAMEWORK_MOTIVES = `
MOTIVES (score the user's top 3 from their ranking Q3 + free text evidence): achievement, power/influence, recognition, security, belonging/acceptance, meaning/spiritual, thrill/risk, pleasure/hedonism, altruism, material. Motives answer WHY the person acts; traits answer HOW. Flag any contradiction between declared ranking and language evidence.
`;

const FRAMEWORK_ENNEAGRAM = `
ENNEAGRAM (from Q2 worldview + corroborating evidence): e1=Perfectionist, e2=Helper, e3=Performer, e4=Individualist, e5=Investigator, e6=Loyalist, e7=Enthusiast, e8=Challenger, e9=Peacemaker. Give type number, name, and the core inner motivation.
`;

const FRAMEWORK_COGNITIVE = `
COGNITIVE ORIENTATION (mainly from Q6+Q9+posts):
- convergent (one precise solution, data, process) vs divergent (many possibilities, connections, "what if").
- systemizer (how systems work: data, frameworks, SOPs) vs empathizer (how people feel: stories, motives, relationships).
`;

const FRAMEWORK_WRITING_DNA = `
WRITING DNA (from Q1, Q6, and pasted posts — the pasted posts are the STRONGEST signal, weight them most):
- language: the language(s) they ACTUALLY write in, read from their real writing samples and open answers (not from the language of this response) — but name it as a short LABEL written in {LANG} itself (e.g. if {LANG} is Hebrew, write something like "אנגלית" or "אנגלית מעורבת בעברית" — a Hebrew label describing their language, never the literal English word). Separately, also give primary_lang_code: the ONE dominant language as a strict "he" or "en" code (pick whichever is more dominant even if they mix) — this code is used elsewhere in the app to pick a default writing language, so it must stay a bare code, never translated.
- average sentence length, punctuation habits (exclamations? ellipses? dashes?), emoji usage (which/none), hook style, humor type, signature_phrases: 2-3 SHORT descriptions (in {LANG}) of their characteristic phrasing or go-to word choices, IN YOUR OWN WORDS — do NOT copy their sentences verbatim, first/second person habits, how they end posts (question? statement? CTA?).
- Also produce 3 DO rules and 3 DON'T rules for ghostwriting this person. Make them specific and actionable (not generic advice) — grounded in the actual evidence from their answers and posts.
`;

const FRAMEWORK_LOCALIZATION = `
LOCALIZATION — language & culture fit (from writing language, phrasing, cultural references in Q1/Q6/posts/About):
- audience: who they write for and the market/culture they operate in.
- language_mix: primary language and how they blend languages (loanwords, code-switching, foreign terms inside their main language, etc.) — described as a short LABEL written in {LANG}, same rule as writing_dna.language: name the languages involved, but write the label itself entirely in {LANG}.
- cultural_markers: local references, idioms, humor style, sensibilities that fit their audience.
- formality: how formal/informal and how they address the reader (ata/at, plural, first-name energy).
- note: one short line on how to keep a post culturally native to them.
Anchor on the declared country/market (USER CONTEXT) combined with the language evidence, not country stereotypes. Use Hofstede's 6 cultural dimensions as a qualitative lens (power distance, individualism/collectivism, masculinity/femininity, uncertainty avoidance, long/short-term, indulgence/restraint) only where actually visible in their writing.
`;

const FRAMEWORK_STORYTELLING = `
STORYTELLING — how they narrate (from Q1, Q6, Q9 and posts):
- structure: how they build a post (e.g. hook → tension → turn → lesson → close), described from their real patterns.
- signature_moves: 2 narrative devices they actually use (each ≤6 words).
- templates: 2 short reusable story skeletons that fit them (each one short line).
- note: one short line on what makes their storytelling land.
Name the closest battle-tested shape in "structure" (Three-Act, PAS, AIDA, BAB, Hero's Journey, StoryBrand, or In Medias Res) rather than inventing vocabulary — whichever actually fits; build "templates" as short skeletons of that shape from their real material.
`;

const FRAMEWORK_IMAGES = `
If profile pictures are provided, use profile-image research: positive emotion + single frontal face → conscientiousness/agreeableness/extraversion signals; aesthetic/unconventional composition → openness; no face/low emotion → openness or neuroticism direction. Treat as weak supporting evidence only.
`;

const CROSS_CHECK = `
CROSS-CHECKING: actively look for contradictions between closed answers and free-text style (e.g., claims introvert but writes with high-energy social markers). List them in "gaps".
`;

/* each call now only writes ~1/3 of the profile, so there's still room for a
   full, grammatical clause even at this budget */
const LENGTH_BUDGET = `
LENGTH BUDGET (STRICT — the response is time-limited, so a complete, tight profile matters more than a thorough one): keep every evidence line, note, do/dont rule, and list item short (max ~16 words) — but it must still be a complete, natural, grammatically whole sentence or clause, never a chopped fragment. No sub-clauses, no examples-in-parentheses, no restating the field name. Total output must stay compact — if in doubt, cut a whole item rather than mangling a sentence to fit. Depth comes from precision, not length.
`;

function groupPrompt(fw, schema){
  return PROFILE_HEADER + fw + LENGTH_BUDGET +
    `\nRespond with ONLY valid JSON, no markdown fences, no preamble. Keep list items to short phrases, BUT the "summary"/"evidence"/"note" fields must be real inference (see the example above), never a restated or lightly-reworded answer. JSON schema:\n${schema}\nAll free-text values, including writing_dna.language and localization.language_mix, must be written entirely in {LANG} — in plain everyday language, with no verbatim quotes of the user's answers and no words borrowed from another language.`;
}

const GROUP_PROMPTS = {
  core: groupPrompt(FRAMEWORK_BIG5 + FRAMEWORK_MOTIVES + FRAMEWORK_ENNEAGRAM + FRAMEWORK_IMAGES, `{
 "summary": "A tight 2-3 sentence psychological portrait in {LANG}, second person, warm but insightful — their defining tension and what really drives them. Feel truly seen, not summarized. No quotes, no filler.",
 "visual_impression": "One short vivid sentence in {LANG} (max ~16 words), third person, describing how you picture this person physically/in a scene based on their profile (e.g. posture, expression, a small telling habit) — an impression, not a literal photo description. Plain language, no clichés, no framework talk.",
 "big5": {"openness":{"score":1-5,"evidence":"a short, complete, natural sentence: the INFERENCE you drew, not a restated answer"},"conscientiousness":{...},"extraversion":{...},"agreeableness":{...},"neuroticism":{...}},
 "motives": [{"id":"...","label_he":"...","label_en":"...","note":"short inference, not the ranking restated"} x3],
 "enneagram": {"type":N,"name_he":"...","name_en":"...","core":"short"}
}`),
  voice: groupPrompt(FRAMEWORK_COGNITIVE + FRAMEWORK_WRITING_DNA, `{
 "cognitive": {"convergent_divergent":"convergent|divergent|balanced","systemizer_empathizer":"systemizer|empathizer|balanced","note":"short"},
 "writing_dna": {"language":"short label in {LANG} — see WRITING DNA rule above","primary_lang_code":"he|en — strict code, see WRITING DNA rule above","sentence_length":"short","punctuation":"short","emoji":"short","hook_style":"short","humor":"short","signature_phrases":["...","..."],"endings":"short","do":["...","...","..."],"dont":["...","...","..."]}
}`),
  context: groupPrompt(FRAMEWORK_LOCALIZATION + FRAMEWORK_STORYTELLING + CROSS_CHECK, `{
 "localization": {"audience":"short","language_mix":"short label in {LANG} — see LOCALIZATION rule above","cultural_markers":"short","formality":"short","note":"short"},
 "storytelling": {"structure":"short","signature_moves":["...","..."],"templates":["...","..."],"note":"short"},
 "gaps": ["...( empty array if none )"]
}`),
};

/* second pass: the 3 group calls above run in parallel and never see each
   other's output, so this pass re-reads the merged draft as a whole to
   catch cross-section contradictions and any line that's really just a
   restated answer rather than a genuine inference */
const FULL_PROFILE_SCHEMA = `{
 "summary": "...", "visual_impression": "...",
 "big5": {"openness":{"score":1-5,"evidence":"..."},"conscientiousness":{...},"extraversion":{...},"agreeableness":{...},"neuroticism":{...}},
 "motives": [{"id":"...","label_he":"...","label_en":"...","note":"..."} x3],
 "enneagram": {"type":N,"name_he":"...","name_en":"...","core":"..."},
 "cognitive": {"convergent_divergent":"...","systemizer_empathizer":"...","note":"..."},
 "writing_dna": {"language":"...","primary_lang_code":"he|en","sentence_length":"...","punctuation":"...","emoji":"...","hook_style":"...","humor":"...","signature_phrases":["...","..."],"endings":"...","do":["...","...","..."],"dont":["...","...","..."]},
 "localization": {"audience":"...","language_mix":"...","cultural_markers":"...","formality":"...","note":"..."},
 "storytelling": {"structure":"...","signature_moves":["...","..."],"templates":["...","..."],"note":"..."},
 "gaps": ["..."]
}`;

const CRITIQUE_PROMPT = `
You wrote a personality/writing profile for a LinkedIn ghostwriting platform, generated as three parallel drafts (personality core, cognitive/voice, localization/storytelling) that could not see each other. Review the MERGED draft below as a whole and fix it.

For every "evidence"/"note"/list item, check:
1. Is it a genuine INFERENCE, or does it just restate/paraphrase an answer? Replace any restatement with what the answer actually reveals about the person.
2. Is it consistent with the rest of the profile? (e.g. a low extraversion score next to a writing_dna.hook_style built on big energetic calls-to-action is a contradiction — resolve it using the actual evidence below, and if it's a real tension worth surfacing rather than an error, add a short line to "gaps".)
3. Does every field follow the grammar, fluency, gender-neutral-Hebrew, and no-em-dash rules from the original instructions? Fix any that don't.

Keep the same length discipline as the draft: each evidence/note/list item ~16 words, "summary" and "visual_impression" as specified originally. Respond with ONLY the corrected full JSON, same schema, no markdown fences, no preamble. All free-text values in {LANG}, with no verbatim quotes of the user's answers. Schema:
${FULL_PROFILE_SCHEMA}
`;

function buildQAText(){
  return QUESTIONS.filter(q=>q.type!=='uploads').map(q=>{
    let a = answers[q.id];
    if(q.type==='single'){const o=q.opts.find(x=>x.v===a);a = a+' — '+(o?o.en:'');}
    if(q.type==='rank'){a = (a||[]).map((v,i)=>`${i+1}. ${v}`).join(' | ');}
    return `Q ${q.id} (${q.en.t}):\n${a}`;
  }).join('\n\n');
}

function buildUserContent(group){
  const qa = buildQAText();
  const noLi=uploads.noLinkedIn;
  const groupText = GROUP_PROMPTS[group].replaceAll('{LANG}', lang==='he'?'Hebrew':'English');
  let text = '=== USER CONTEXT ===\nName: ' + (profileName||'-')
    + '\nCountry/market: ' + (countryName(profileCountry,'en')||'not specified')
    + (noLi?'\nNote: this person does NOT have a LinkedIn profile — the writing sample below is general (not LinkedIn posts), so weight it as their natural voice and infer the LinkedIn fit rather than assuming existing LinkedIn habits.':'')
    + '\n\n=== QUESTIONNAIRE ANSWERS ===\n' + qa;
  if(uploads.posts.trim()) text += (noLi?'\n\n=== USER\'S WRITING SAMPLE (general, not from LinkedIn — strongest style signal) ===\n':'\n\n=== USER\'S REAL LINKEDIN POSTS (strongest style signal) ===\n')+uploads.posts.trim();
  if(uploads.about.trim()) text += (noLi?'\n\n=== ABOUT THE USER (self-described) ===\n':'\n\n=== LINKEDIN ABOUT ===\n')+uploads.about.trim();

  /* each group's instructions are identical for every user calling that group
     (in any given language), so they're the cached block — same pattern as the
     old single-CODEX cache, just split three ways. Short prompts may fall under
     the provider's minimum cacheable size and simply no-op, which is harmless. */
  const content=[
    {type:'text', text:groupText, cache_control:{type:'ephemeral'}},
    {type:'text', text}
  ];
  /* profile pictures only inform Big 5 / motives / enneagram (the "core"
     group) — no point re-sending image bytes to the other parallel calls */
  if(group==='core') uploads.images.forEach(im=>content.push({type:'image',source:{type:'base64',media_type:im.media_type,data:im.data}}));
  return content;
}

async function callClaude(content, useSearch, maxTokens, model, onDelta){
  const headers={'Content-Type':'application/json'};
  const token = window.__getToken ? await window.__getToken() : '';
  if(token) headers['Authorization']='Bearer '+token;
  const response = await fetch('/api/claude',{
    method:'POST',
    headers,
    body:JSON.stringify({
      model:model||'claude-sonnet-5',
      max_tokens:maxTokens||8000,
      /* adaptive thinking — Sonnet 5's near-Opus quality on nuanced language/
         reasoning tasks depends on this; disabling it (as before) was actively
         working against profile accuracy. Streaming already keeps us well
         inside the serverless time limit regardless of thinking. */
      thinking:{type:'adaptive'},
      messages:[{role:'user',content}],
      ...(useSearch?{tools:[{type:'web_search_20250305',name:'web_search'}]}:{})
    })
  });
  /* read as text first: a timed-out or crashed serverless function returns an
     HTML/plain error page, and response.json() would blow up with a cryptic
     "Unexpected token" instead of a usable message */
  const __ct=response.headers.get('content-type')||'';
  const __isStream=!!response.body && __ct.indexOf('event-stream')>=0;
  let __streamText='', __stopReason=null, __streamErr=null;
  if(__isStream){
    const __reader=response.body.getReader();
    const __dec=new TextDecoder();
    let __buf='';
    const __handle=line=>{
      const s=line.trim();
      if(s.indexOf('data:')!==0) return;
      const j=s.slice(5).trim();
      if(!j||j==='[DONE]') return;
      try{
        const e=JSON.parse(j);
        if(e.type==='content_block_delta'&&e.delta&&typeof e.delta.text==='string') __streamText+=e.delta.text;
        else if(e.type==='message_delta'&&e.delta&&e.delta.stop_reason) __stopReason=e.delta.stop_reason;
        else if(e.type==='error'&&e.error) __streamErr=e.error;
      }catch(_){/* skip partial/keepalive lines */}
    };
    while(true){
      const{done,value}=await __reader.read();
      if(done) break;
      __buf+=__dec.decode(value,{stream:true});
      const parts=__buf.split('\n');
      __buf=parts.pop();
      for(const line of parts) __handle(line);
      if(onDelta) onDelta(__streamText);
    }
    if(__buf) __handle(__buf); /* flush any trailing line without a newline */
  }
  const raw=__isStream
    ? JSON.stringify({content:[{type:'text',text:__streamText}],stop_reason:__stopReason,error:__streamErr})
    : await response.text();
  let data;
  try{ data = JSON.parse(raw); }
  catch(_){
    const snippet = raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,120);
    if(response.status===504 || /timeout|timed out/i.test(raw))
      throw new Error('The server took too long and timed out. Please try again.');
    throw new Error('Server error (HTTP '+response.status+'): '+(snippet||'no details'));
  }
  if(data.error && data.error.type==='usage_limit_reached') throw new Error(T().err_usage_limit);
  if(data.error) throw new Error(data.error.message||'API error');
  if(!response.ok) throw new Error('Server error (HTTP '+response.status+')');
  const txt = (data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
  /* a cut-off response (hit the token cap) leaves the JSON unterminated;
     say so plainly instead of the cryptic "No JSON in response" */
  if(data.stop_reason==='max_tokens') throw new Error('The response was cut off (reached the length limit). Try again.');
  /* pause_turn = Claude paused to run a server tool (web search) and expects a
     continuation this single-shot call doesn't provide. Insight generation uses
     no search, so this only guards the composer's optional link-reading. */
  if(data.stop_reason==='pause_turn') throw new Error('That step needed an external lookup that didn\'t finish. Try again, or remove the link.');
  const __sr = data.stop_reason ? ' [stop:'+data.stop_reason+']' : '';
  if(!txt || !txt.trim()) throw new Error('The model returned an empty response'+__sr+'. Please try again.');
  try{ return sanitizeDeep(extractJSON(txt)); }
  catch(_){
    const clip=txt.trim().replace(/\s+/g,' ').slice(0,90);
    throw new Error('Could not read the result'+__sr+' — it began: "'+clip+'…"');
  }
}

/* hard guarantee (independent of the model following instructions): strip
   em dashes from every generated string before it ever reaches the screen */
function stripEmDash(s){
  if(typeof s!=='string') return s;
  return s.replace(/\s*—\s*/g,', ').replace(/,\s*,/g,',').replace(/,\s*([.!?])/g,'$1').trim();
}
function sanitizeDeep(val){
  if(typeof val==='string') return stripEmDash(val);
  if(Array.isArray(val)) return val.map(sanitizeDeep);
  if(val && typeof val==='object'){
    const out={};
    for(const k in val) out[k]=sanitizeDeep(val[k]);
    return out;
  }
  return val;
}

/* pull the first complete top-level JSON object out of a text blob,
   ignoring any commentary the model may have added before/after it */
function extractJSON(txt){
  txt = txt.replace(/```(?:json)?/gi,''); /* drop any markdown code fences the model may add */
  const start = txt.indexOf('{');
  if(start===-1) throw new Error('No JSON in response');
  let depth=0, inStr=false, esc=false;
  for(let i=start;i<txt.length;i++){
    const ch=txt[i];
    if(inStr){
      if(esc) esc=false;
      else if(ch==='\\') esc=true;
      else if(ch==='"') inStr=false;
    }else{
      if(ch==='"') inStr=true;
      else if(ch==='{') depth++;
      else if(ch==='}'){ depth--; if(depth===0) return JSON.parse(txt.slice(start,i+1)); }
    }
  }
  throw new Error('No JSON in response');
}

function generateHTML(){
  const t=T();
  runGeneration();
  return `<div class="step active loading">
    <div class="pulse"></div>
    <p id="loading-msg">${t.analyzing[0]}</p>
    <p id="loading-preview" class="loading-preview"></p>

/* pull out the growing "summary" string from a streaming, still-incomplete
   JSON blob so the loading screen can show the profile being written live */
function partialInsightPreview(raw){
  const m = raw.match(/"summary"\s*:\s*"((?:[^"\\]|\\.)*)/);
  if(!m) return '';
  let s = m[1];
  if(s.endsWith('\\')) s = s.slice(0,-1);
  return s.replace(/\\n/g,' ').replace(/\\"/g,'"').replace(/\\\\/g,'\\');
}

let loadTimer=null;
async function runGeneration(refineNote){
  const t=T();
  let i=0;
  clearInterval(loadTimer);
  loadTimer=setInterval(()=>{
    i=(i+1)%t.analyzing.length;
    const el=document.getElementById('loading-msg');
    if(el) el.textContent=t.analyzing[i];
  },2200);

  try{
    if(refineNote && profile){
      const existingPhoto = profile.photo;
      const content=[{type:'text',text:
        `Here is an existing personality/writing profile JSON:\n${JSON.stringify({...profile, photo:undefined})}\n\nThe user corrected it: "${refineNote}"\n\nApply the correction thoughtfully (adjust related fields too, e.g. if they say "I never use emojis" fix writing_dna.emoji and the do/dont rules). Respond with ONLY the full updated JSON, same schema, no fences. Free-text values in ${lang==='he'?'Hebrew':'English'}.`}];
      profile = await callClaude(content, false, 16000, 'claude-sonnet-5');
      profile.photo = existingPhoto; /* a correction doesn't change how they look */
    } else {
      /* 3 independent calls in parallel, each writing a disjoint slice of the
         profile — cuts wall-clock time vs. one call writing everything in
         sequence, which is what makes Opus's extra depth affordable here. A
         4th, cheaper pass then reviews the merged result as a whole (see
         CRITIQUE_PROMPT) since the 3 calls never see each other's output. */
      const onDelta = raw=>{
        const preview = partialInsightPreview(raw);
        if(!preview) return;
        clearInterval(loadTimer);
        const msgEl=document.getElementById('loading-msg');
        if(msgEl) msgEl.textContent=t.analyzing[t.analyzing.length-1];
        const prevEl=document.getElementById('loading-preview');
        if(prevEl) prevEl.textContent=preview;
      };
      const [core, voice, context] = await Promise.all([
        callClaude(buildUserContent('core'), false, 12000, 'claude-opus-4-8', onDelta),
        callClaude(buildUserContent('voice'), false, 12000, 'claude-opus-4-8'),
        callClaude(buildUserContent('context'), false, 12000, 'claude-opus-4-8'),
      ]);
      const draft = Object.assign({}, core, voice, context);
      try{
        const critiqueContent=[{type:'text',text:
          CRITIQUE_PROMPT.replaceAll('{LANG}', lang==='he'?'Hebrew':'English')
          + '\n\n=== QUESTIONNAIRE ANSWERS ===\n' + buildQAText()
          + '\n\n=== MERGED DRAFT PROFILE ===\n' + JSON.stringify(draft)}];
        profile = await callClaude(critiqueContent, false, 16000, 'claude-opus-4-8');
      }catch(critiqueErr){
        console.warn('profile critique pass failed, using merged draft as-is', critiqueErr);
        profile = draft;
      }
      if(uploads.images.length) profile.photo = { media_type: uploads.images[0].media_type, data: uploads.images[0].data, source:'upload' };
    }
    profile._lang = lang;
    profile._name = profileName;
    profile._country = profileCountry;
    profileVariants = { [lang]: profile }; /* fresh analysis → drop any stale translations */
    { const e = activeProfileId ? profilesStore.profiles.find(p=>p.id===activeProfileId) : null; if(e) e.variants = { [lang]: profile }; }
    clearInterval(loadTimer);
    step=QUESTIONS.length+1; approved=false; render();
    /* no uploaded photo → generate one in the background; the results page
       already shows the initials placeholder + text impression while this runs */
    if(!refineNote && !uploads.images.length) generateAvatarImage(profile);
  }catch(err){
    clearInterval(loadTimer);
    console.error('Claude API error:',err);
    const card=document.getElementById('main-card');
    card.innerHTML=`<div class="step active">
      <div class="error-box">${t.err_api}<br><small style="opacity:.7">${(err&&err.message)||''}</small></div>
      ${String(err&&err.message).includes('fetch')?`
      <div class="gap-note" style="margin-top:14px">
        <b>${lang==='he'?'פתרון: מפתח API אישי':'Fix: personal API key'}</b><br>
        ${lang==='he'?'הקובץ רץ מחוץ ל-Claude, אז צריך מפתח משלכם (אותו אחד מהגנרטור). הוא לא נשמר בשום מקום - רק בזיכרון של העמוד.':'The file runs outside Claude, so it needs your own key. It is not stored anywhere - memory only.'}<br>
        <input type="text" id="api-key-input" style="min-height:auto;margin-top:8px" placeholder="sk-ant-..." value="${apiKey}" class="vp-input">
      </div>`:''}
      <div class="nav"><button class="vp-btn-secondary" onclick="step=${QUESTIONS.length-1};render()">${t.back}</button>
      <button class="vp-btn" onclick="const k=document.getElementById('api-key-input');if(k)apiKey=k.value.trim();step=${QUESTIONS.length};render()">${t.retry}</button></div></div>`;
  }
}

/* runs in the background after a fresh (non-refine) generation when no photo
   was uploaded; a failure here is silent — the initials placeholder stays and
   the rest of the profile is unaffected */
async function generateAvatarImage(forProfile){
  try{
    const headers={'Content-Type':'application/json'};
    const token = window.__getToken ? await window.__getToken() : '';
    if(token) headers['Authorization']='Bearer '+token;
    const response = await fetch('/api/image',{
      method:'POST', headers,
      body:JSON.stringify({prompt:avatarPrompt(forProfile)})
    });
    const data = await response.json();
    if(!response.ok || data.error) throw new Error((data.error&&data.error.message)||'Image generation failed');
    if(profile!==forProfile) return; /* user moved on (new/refined/switched profile) before this resolved */
    profile.photo = { media_type: data.media_type, data: data.data, source:'generated' };
    const entry = activeProfileId ? profilesStore.profiles.find(p=>p.id===activeProfileId) : null;
    if(entry){ entry.profile = profile; persistProfiles().catch(()=>{}); }
    if(step===QUESTIONS.length+1) render();
  }catch(err){
    console.error('avatar image generation failed:', err);
  }
}

/* keep the generated profile in sync with the UI language — this only
   re-translates the tool's own analysis text, never the user's answers
   or the ghostwritten post (that stays in the person's real voice) */
/* per-profile store of already-generated language versions */
function langVariants(){
  const entry = activeProfileId ? profilesStore.profiles.find(p=>p.id===activeProfileId) : null;
  if(entry){ entry.variants = entry.variants || {}; return entry.variants; }
  return profileVariants;
}
function applyProfileLang(p,target){
  p._lang = target;
  profile = p;
  const entry = activeProfileId ? profilesStore.profiles.find(x=>x.id===activeProfileId) : null;
  if(entry){ entry.profile=profile; entry.lang=target; persistProfiles().catch(()=>{}); }
}

async function translateProfile(target){
  if(!profile) return;
  const cur = profile._lang || lang;
  if(cur===target) return;
  const vars = langVariants();
  /* remember the version we're leaving so we can come back to it instantly */
  vars[cur] = profile;
  /* already have this language? just revert — never regenerate */
  if(vars[target]){
    applyProfileLang(vars[target], target);
    if(step===QUESTIONS.length+1) render();
    return;
  }
  const onProfileStep = step===QUESTIONS.length+1;
  const card = document.getElementById('main-card');
  if(onProfileStep && card){
    card.innerHTML = `<div class="step active loading"><div class="pulse"></div><p>${target==='he'?'כותב את הפרופיל בעברית...':'Writing your profile in English...'}</p></div>`;
  }
  let failed=false, errMsg='';
  try{
    const content=[{type:'text',text:
      `Here is an existing personality/writing profile JSON:\n${JSON.stringify({...profile, photo:undefined})}\n\nRe-express this SAME profile in ${target==='he'?'Hebrew':'English'}, written NATIVELY — as if it had been authored in ${target==='he'?'Hebrew':'English'} from the start. Do NOT do a stiff word-for-word translation: use natural phrasing, idiom and rhythm of ${target==='he'?'Hebrew':'English'} so it reads like an original, while keeping the exact same meaning, insights and judgments. Keep the exact same JSON schema, field names, and array lengths and order — same analysis, new language. EVERY field including writing_dna.language and localization.language_mix must be written entirely in ${target==='he'?'Hebrew':'English'} too (they are short labels naming the user's real writing language, phrased in ${target==='he'?'Hebrew':'English'} words — never leave them in the other language). EXCEPT writing_dna.primary_lang_code — that is a strict "he" or "en" code, not text to translate; copy it through completely unchanged. ${target==='he'?'If Hebrew, address the reader in gender-neutral plural forms (את/ה, אתם), never masculine-only.':''} Output nothing but the JSON object, no markdown fences, no preamble, no trailing commentary.`}];
    const translated = await callClaude(content, false, 16000, 'claude-sonnet-5');
    translated._lang = target;
    translated.photo = profile.photo; /* translation never touches the photo */
    vars[target] = translated;
    applyProfileLang(translated, target);
  }catch(err){
    console.error('profile translation failed:',err);
    failed=true; errMsg=(err&&err.message)||'';
  }
  if(step===QUESTIONS.length+1){
    render();
    if(failed && card){
      const t=T();
      card.insertAdjacentHTML('beforeend',`<div class="gap-note" id="translate-err" style="margin-top:14px">${target==='he'?'התרגום האוטומטי נכשל - עדיין מוצג בשפה הקודמת.':'Automatic translation failed - still showing the previous language.'} <button class="vp-btn-secondary" style="padding:6px 16px;margin-top:8px" onclick="document.getElementById('translate-err').remove();translateProfile('${target}')">${t.retry}</button><br><small style="opacity:.6">${escapeHtml(errMsg)}</small></div>`);
    }
  }
}

  const accDNA=acc('dna', t.dna_h, t.badge_traits.replace('{n}',dnaCount),
    `<ul class="dna-list">${dnaRows}</ul>${sigs?`<div class="vp-chips" style="margin-top:12px">${sigs}</div>`:''}`);
  const accRules=acc('rules', t.rules_h, t.badge_rules.replace('{d}',(dna.do||[]).length).replace('{n}',(dna.dont||[]).length),
    `<ul class="dna-list rules-list">${rules}</ul>`);
  const accGaps=(p.gaps&&p.gaps.length)
    ? acc('gaps', t.gaps_h, t.badge_flags.replace('{n}',p.gaps.length),
        `<div class="gap-note">${p.gaps.map(g=>`<div class="vp-gap-row">${g}</div>`).join('')}</div>`)
    : '';

  /* quick-facts snapshot for the hero's middle card, computed from data we already have */
  const big5TopIdx = traits.reduce((best,tr,i)=>((p.big5[tr]&&p.big5[tr].score)||0) > ((p.big5[traits[best]]&&p.big5[traits[best]].score)||0) ? i : best, 0);
  const topMotive = (p.motives&&p.motives[0]) ? (lang==='he'?(p.motives[0].label_he||p.motives[0].id):(p.motives[0].label_en||p.motives[0].id)) : '';
  const layerFacts=[
    {label:t.big5_h, value:t.traits[traits[big5TopIdx]]},
    {label:t.motives_h, value:topMotive},
    {label:t.ennea_h, value:lang==='he'?(en.name_he||''):(en.name_en||'')},
    {label:t.cog_h, value:[cg.convergent_divergent,cg.systemizer_empathizer].filter(Boolean).join(' · ')},
    {label:t.local_h, value:loc.audience||''},
    {label:t.story_h, value:st.structure||''}
  ].filter(f=>f.value);

  /* avatar: a real uploaded photo wins; otherwise a generated portrait once
     it's ready; until then, initials + a text impression as the meantime state */
  let avatarInner, impressionText;
  if(p.photo && p.photo.data){
    avatarInner = `<img src="data:${p.photo.media_type};base64,${p.photo.data}" alt="">`;
    impressionText = p.photo.source==='generated' ? (t.avatar_photo_caption||'') : '';
  } else {
    const initials=(profileName||'').trim().split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
    avatarInner = initials ? `<span class="avatar-initials">${escapeHtml(initials)}</span>` : AVATAR_FALLBACK_SVG;
    impressionText = p.visual_impression ? escapeHtml(p.visual_impression) : '';
  }

  return `<div class="step active vp-profile">
    <div class="vp-deco" aria-hidden="true"><span class="vp-deco-ring"></span><span class="vp-deco-arch"></span></div>

    <div class="eyebrow vp-label">${t.profile_h}${profileName?` · ${escapeHtml(profileName)}`:''}</div>
    <h1 class="vp-display">${t.profile_display_h}</h1>
    ${approved?'':`<p class="vp-display-sub">${t.profile_sub}</p>`}

    <div class="vp-hero">
      <div class="vp-hero-summary">
        <div class="vp-hero-h">${t.summary_h}</div>
        <p class="vp-hero-text">${p.summary||''}</p>
      </div>
      <div class="vp-hero-facts">
        <div class="vp-hero-h">${t.layers_h}</div>
        <ul class="vp-facts">${layerFacts.map(f=>`<li><span class="vp-fact-k">${f.label}</span><span class="vp-fact-v">${f.value}</span></li>`).join('')}</ul>
      </div>
      <div class="vp-hero-portrait">
        <div class="vp-portrait-img">${avatarInner}</div>
        <div class="vp-label">${t.portrait_label}</div>
        ${impressionText?`<p class="vp-portrait-note">${impressionText}</p>`:''}
      </div>
    </div>

    ${tabsHTML}
    ${panelHTML}

    ${accDNA}
    ${accRules}
    ${accGaps}

    ${approved?`<div class="approved-banner">${t.approved}<br><button class="vp-btn" style="background:var(--on-accent);color:var(--accent);margin-top:14px" onclick="step=STEP_COMPOSER;render()">${t.to_composer}</button></div>`:`
    <div class="vp-panel vp-refine">
      <h3 class="vp-panel-h">${t.refine_label}</h3>
      <textarea id="refine-ta" class="vp-input" style="min-height:90px" placeholder="${t.refine_ph}"></textarea>

        <button class="vp-btn" id="approve-btn">${t.approve_btn}</button>
      </div>
    </div>`}
  </div>`;
}

/* re-express an already-generated post natively in the new language —
   not a literal translation, same message/hook/structure, native phrasing */
async function rewritePostLang(targetLang, prevLang){
  const t=T();
  const card=document.getElementById('main-card');
  card.innerHTML=`<div class="step active loading"><div class="pulse"></div><p>${targetLang==='he'?'כותבים את הפוסט מחדש בעברית...':'Rewriting the post in English...'}</p></div>`;
  try{
    const content=[{type:'text',text:
      `Here is an existing LinkedIn post with alternative hooks:\n${JSON.stringify(currentPost)}\n\nRe-express this SAME post NATIVELY in ${targetLang==='he'?'Hebrew':'English'} — as if it had been written in ${targetLang==='he'?'Hebrew':'English'} from the start, with real slang, idiom and rhythm a native speaker actually uses. Do NOT do a literal, stiff translation. Keep the exact same message, structure, hook and tone. NEVER use an em dash (—). Same JSON shape: {"post":"...","hooks":["...","..."]}. Output nothing but the JSON, no fences, no preamble.`}];
    currentPost = await callClaude(content, false, 12000);
    comments=null; /* stale — was generated for the previous language/wording */
    if(postApproved) savePostHistory(); /* only an approved post belongs in history */
    render();
  }catch(err){
    console.error('post language rewrite failed:',err);
    postLang=prevLang;
    render();
    document.getElementById('main-card').insertAdjacentHTML('beforeend',
      `<div class="gap-note">${t.err_api}<br><small style="opacity:.7">${escapeHtml((err&&err.message)||'')}</small></div>`);

async function brainstormTopics(){
  const t=T();
  const box=document.getElementById('ideas-box');
  if(!box) return;
  const selectedCats=Object.keys(ideasCats).filter(k=>ideasCats[k]);

  const langName=lang==='he'?'Hebrew':'English';

  const catDefs=`- "news": an ongoing trend, debate, or recurring theme they could weigh in on (from your knowledge — no need for a specific dated event).
- "professional": an insight, lesson, or take from their professional world.
- "personal": a value, belief, or general reflection touching personal life — do NOT invent a specific personal anecdote, past client, or story about them; keep it general. They'll get a chance to add their own real personal detail after picking an idea.
- "hobby": tied to interests or hobbies visible in their profile.`;

  const text = ideasMode==='topic'
    ? `You help this person brainstorm LinkedIn post ideas about a SPECIFIC topic they gave you, tailored to their voice and worldview. Their full profile (personality, motives, writing DNA, localization, storytelling):
${JSON.stringify({...profile, photo:undefined})}

The topic to brainstorm about: "${ideasTopic.trim()}"

Suggest 8 concrete post ideas — each a DIFFERENT angle on this exact topic — using ONLY these categories of angle: ${catList}.
${catDefs}
Write each idea in ${langName}, matching their voice and audience (localization). "title" = a short scroll-stopping idea; "angle" = one line on what the post would actually say. Every idea must clearly be about "${ideasTopic.trim()}" — do not drift to unrelated topics.

Respond with ONLY valid JSON, no fences: {"ideas":[{"category":"...","title":"...","angle":"..."}]}`
    : `You help this person decide WHAT to post on LinkedIn when they have nothing specific in mind. Their full profile (personality, motives, writing DNA, localization, storytelling):
${JSON.stringify({...profile, photo:undefined})}

Suggest 8 concrete post ideas tailored to THIS person — drawn from your own knowledge of their field and of evergreen conversations in it, NOT from any live search. Use ONLY these categories: ${catList}.
${catDefs}
Write each idea in ${langName}, matching their voice and audience (localization). "title" = a short scroll-stopping idea; "angle" = one line on what the post would actually say. Make them specific to this person, not generic.

Respond with ONLY valid JSON, no fences: {"ideas":[{"category":"...","title":"...","angle":"..."}]}`;

  try{
